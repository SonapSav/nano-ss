name: nano-ss

x-host-user: &host-user '${HOST_UID:-1000}:${HOST_GID:-1000}'

services:
  # Development tooling: `make dev` runs the Vite dev server on 5173;
  # `make check`, `make test`, etc. run one-off commands in this image.
  dev:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    user: *host-user
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm-store:/pnpm-store
    ports:
      - '5173:5173'
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev"

  # Production: nginx serving the built app over HTTPS on 8787.
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    user: *host-user
    volumes:
      - ./certs:/etc/nginx/certs:ro
    ports:
      - '8787:8787'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 5s
      retries: 3

  # One-off: `make certs` creates the local CA and server certificate.
  certs:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/certs.Dockerfile
    user: *host-user
    environment:
      CERT_HOSTS: ${CERT_HOSTS:-localhost 127.0.0.1 ::1}
    volumes:
      - ./certs:/certs

volumes:
  node_modules:
  pnpm-store:
