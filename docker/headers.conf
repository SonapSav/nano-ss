# Cross-origin isolation: enables SharedArrayBuffer for physics and scenery
# workers. Included in every location because add_header is not inherited
# once a location sets its own headers.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header X-Content-Type-Options "nosniff" always;
