server {
    listen 8787 ssl;
    listen [::]:8787 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Plain HTTP sent to this HTTPS port: redirect instead of nginx's 400 page.
    error_page 497 =301 https://$host:$server_port$request_uri;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml model/gltf+json;

    # Hashed build output: safe to cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.glb$ {
        include /etc/nginx/snippets/headers.conf;
        types { }
        default_type model/gltf-binary;
    }

    location ~* \.ktx2$ {
        include /etc/nginx/snippets/headers.conf;
        types { }
        default_type image/ktx2;
    }

    location / {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

# Health check, reachable only from inside the container.
server {
    listen 127.0.0.1:8080;
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
