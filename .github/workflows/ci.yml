name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same Docker setup as local development: no Node on the runner is used.
      - name: Lint, format check, type check, and test
        run: make check

      - name: Build the production image
        run: make build
